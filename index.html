function chunkText(words, startIdx = 0) {
  const slice = words.slice(startIdx);
  const chunks = []; let cur = [], curStart = startIdx, len = 0;
  slice.forEach((w, k) => {
    cur.push(w); len += w.length + 1;
    if (len > 180 || /[.!?]$/.test(w)) { chunks.push({ words: cur, start: curStart, text: cur.join(" ") }); curStart = startIdx + k + 1; cur = []; len = 0; }
  });
  if (cur.length) chunks.push({ words: cur, start: curStart, text: cur.join(" ") });
  return chunks;
}

function analyzeCalibration(points) {
  const p = [...points].sort((a, b) => a.wpm - b.wpm);
  let optimal = null, basal = null, ceiling = null;
  for (const pt of p) if (pt.comp >= 0.8) optimal = pt.wpm;
  for (const pt of p) if (pt.comp >= 0.999) basal = pt.wpm;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i], b = p[i + 1];
    if (a.comp >= 0.7 && b.comp < 0.7) {
      const t = (a.comp - 0.7) / (a.comp - b.comp);
      ceiling = Math.round(a.wpm + t * (b.wpm - a.wpm));
      break;
    }
  }
  if (ceiling === null && p.every(x => x.comp >= 0.7)) ceiling = p[p.length - 1].wpm;
  return { optimal: optimal || p[0].wpm, basal, ceiling };
}

// ── ORP ───────────────────────────────────────────────────────────────────────
function getORP(word) {
  const len = word.replace(/[^a-zA-ZáéíóúñüÁÉÍÓÚÑÜ]/g, "").length;
  if (len <= 1) return 0;
  if (len <= 5) return 1;
  if (len <= 9) return 2;
  if (len <= 13) return 3;
  return Math.floor(len * 0.25);
}

// Per-word delay: base × length term, then punctuation pause (scaled).
function getDelay(word, wpm, pauseScale) {
  const base = (60 / wpm) * 1000;
  const len = word.replace(/[^a-zA-ZáéíóúñüÁÉÍÓÚÑÜ]/g, "").length;
  const lengthMult = 1 + Math.max(0, len - AVG_WORD_LEN) * 0.04;
  const withLen = base * lengthMult;
  let mult = 1;
  if (/[.!?]["')\]]?$/.test(word)) mult = 1.8;
  else if (/[,;:]["')\]]?$/.test(word)) mult = 1.35;
  return Math.round(withLen * (1 + (mult - 1) * pauseScale));
}

// ── Pivot-anchored word: 3-cell grid, pivot fixed at PIVOT_X ──────────────────
function WordDisplay({ word, fontSize, pivotColor }) {
  if (!word) return null;
  const orp = getORP(word);
  const before = word.slice(0, orp);
  const pivot = word.slice(orp, orp + 1);
  const after = word.slice(orp + 1);
  const leftFr = PIVOT_X, rightFr = 1 - PIVOT_X;
  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: `minmax(0, ${leftFr}fr) auto minmax(0, ${rightFr}fr)`,
      alignItems: "baseline", width: "100%",
      fontFamily: "'Fraunces', 'DM Serif Display', Georgia, serif",
      fontSize: `${fontSize}px`, letterSpacing: "-0.01em",
      userSelect: "none", lineHeight: 1.05, whiteSpace: "nowrap",
    }}>
      <span style={{ color: "var(--text2)", textAlign: "right", overflow: "hidden" }}>{before}</span>
      <span style={{ color: pivotColor, fontWeight: 600, textAlign: "center", padding: "0 0.04em" }}>{pivot}</span>
      <span style={{ color: "var(--text2)", textAlign: "left", overflow: "hidden" }}>{after}</span>
    </div>
  );
}

function parseText(text) {
  return text.replace(/\n+/g, " ").split(/\s+/).map(w => w.trim()).filter(w => w.length > 0);
}

// Lector de audio: texto continuo con la frase activa resaltada y autoscroll (estilo escucha)
function AudioReader({ chunks, activeChunk, loading, accent, onSeek, reduce, hasText }) {
  const activeRef = useRef(null);
  const scrollRef = useRef(null);
  useEffect(() => {
    const el = activeRef.current, box = scrollRef.current;
    if (el && box) {
      // scroll interno al panel, centrando la frase activa (sin mover la página)
      const top = el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2;
      try { box.scrollTo({ top, behavior: reduce ? "auto" : "smooth" }); } catch { box.scrollTop = top; }
    }

// ── Native ZIP reader (no deps, browser DecompressionStream) ──────────────────
async function readZip(arrayBuffer) {
  const dv = new DataView(arrayBuffer);
  const bytes = new Uint8Array(arrayBuffer);
  const n = dv.byteLength;
  let eocd = -1;
  for (let i = n - 22; i >= 0 && i >= n - 22 - 65536; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("ZIP/EPUB corrupto: no se encontró el directorio central.");
  const cdCount = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const entries = {};
  let p = cdOffset;
  for (let e = 0; e < cdCount; e++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, compSize, localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { entries, bytes, dv };
}
async function zipReadText(zip, name) {

  const { dv, bytes } = zip;
  const lp = ent.localOff;
  if (dv.getUint32(lp, true) !== 0x04034b50) throw new Error("ZIP: cabecera local inválida.");
  const nameLen = dv.getUint16(lp + 26, true);
  const extraLen = dv.getUint16(lp + 28, true);
  const dataStart = lp + 30 + nameLen + extraLen;
  const comp = bytes.subarray(dataStart, dataStart + ent.compSize);
  if (ent.method === 0) return new TextDecoder().decode(comp);
  if (typeof DecompressionStream === "undefined") throw new Error("Tu navegador no soporta descompresión nativa.");

  const stream = new Blob([comp]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

        if (!payload.data || typeof payload.data !== "object") throw new Error("El backup no contiene datos válidos.");
        // 4) aceptar solo claves conocidas (prefijos permitidos), descartar el resto
        const allowedExact = new Set(["sr:prefs", "sr:metrics", "sr:summaries", "sr:sessions", "sr:calibration", "sr:calibrations", "sr:checks", "sr:docs"]);
        const allowedPrefix = ["sr:pos:", "sr:doctext:"];
        const entries = Object.entries(payload.data).filter(([k, v]) =>
          typeof k === "string" && typeof v === "string" &&
          (allowedExact.has(k) || allowedPrefix.some(p => k.startsWith(p)))
        );
        if (entries.length === 0) throw new Error("El backup no contiene datos reconocibles de Lector.");
        // 5) cada valor debe ser JSON parseable (descarta entradas corruptas en silencio)
        let restored = 0;
        entries.forEach(([k, v]) => {
          try { JSON.parse(v); localStorage.setItem(k, v); restored++; } catch {}
        });
        if (restored === 0) throw new Error("No se pudo restaurar ninguna entrada válida.");
        alert(`Datos restaurados (${restored} elementos). La app se recargará para aplicarlos.`);
        window.location.reload();
      } catch (e) {
        alert("No se pudo restaurar: " + e.message);
      }

    if (startCi < 0) startCi = 0;
    const voiceObj = voices.find(v => v.voiceURI === audioVoice);
    let ci = startCi;
    const next = () => {
      if (!playingRef.current) return;
      if (ci >= all.length) { setPlaying(false); setActiveChunk(-1); finishSession(); return; }
      const ch = all[ci];
      setActiveChunk(ci);
      setIndex(ch.start);
      const u = new SpeechSynthesisUtterance(ch.text);
      if (voiceObj) u.voice = voiceObj;
      u.rate = audioRate; u.lang = voiceObj ? voiceObj.lang : "es-ES";
      u.onboundary = (e) => {

      u.onend = () => { ci++; next(); };

      {/* ── HISTORY OVERLAY ── */}
      {panel === "history" && (
        <div style={{ position:"absolute", inset:0, zIndex:50, background:"var(--bg)ee", backdropFilter:"blur(8px)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"24px", overflowY:"auto" }}>
          <div className={anim("reveal")} style={{ width:"100%", maxWidth:520, background:"var(--surface)", border:"1px solid var(--bord2)", borderRadius:20, padding:"24px", display:"flex", flexDirection:"column", gap:18, marginTop:"4vh", marginBottom:"4vh" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div style={{ fontFamily:"'Fraunces',serif", fontSize:24, color:"var(--accent)" }}>Velocidad vs retención</div>
              <button onClick={() => setPanel(null)} style={{ background:"transparent", border:"none", color:"var(--text4)", cursor:"pointer", fontSize:26, lineHeight:1 }}>×</button>
            </div>
            {history.filter(h => h.retention).length >= 2 ? (
              <ScatterRetention data={history.filter(h => h.retention)} />
            ) : (
              <div style={{ fontSize:13, color:"var(--text5)", padding:"8px 0" }}>Aún no hay suficientes sesiones puntuadas. Puntúa la retención al cerrar cada sesión para ver si se degrada al subir de velocidad.</div>
            )}
            <div style={{ borderTop:"1px solid var(--bord)", paddingTop:14, display:"flex", flexDirection:"column", gap:10 }}>
              <div style={{ fontSize:11, color:"var(--text6)", letterSpacing:"0.1em", textTransform:"uppercase" }}>Historial</div>
              {history.length === 0 && <div style={{ fontSize:13, color:"var(--text5)" }}>Sin sesiones guardadas todavía.</div>}
              {history.map((h, i) => (
                <div key={i} style={{ background:"var(--surface2)", border:"1px solid var(--bord)", borderRadius:12, padding:"12px 14px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:13, color:"var(--text2)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1 }}>{h.doc}</span>
                    <span className="mono" style={{ fontSize:12, color:"var(--accent)" }}>{h.wpm}·cad</span>
                    {h.retention ? <span className="mono" style={{ fontSize:12, color:"#5fb86a" }}>ret {h.retention}/5</span> : null}
                  </div>
                  {h.note && <div style={{ fontSize:13, color:"var(--text4)", marginTop:6, fontStyle:"italic" }}>“{h.note}”</div>}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:6 }}>
                    <div className="mono" style={{ fontSize:10, color:"var(--text7)" }}>{fmtDate(h.ts)} · {fmtMs(h.ms)}</div>
                    <button className="ctrl-btn" onClick={() => exportMarkdown(h)} style={{ background:"transparent", border:"1px solid var(--bordc)", color:"var(--text5)", borderRadius:7, padding:"4px 10px", fontSize:11, cursor:"pointer" }}>.md</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── Header ── */}
      <div className={mounted ? anim("reveal") : ""} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"max(14px, env(safe-area-inset-top)) 18px 12px", borderBottom:"1px solid var(--bord)", gap:8, position:"relative", zIndex:2 }}>
        <span style={{ fontFamily:"'Fraunces',serif", fontSize:19, color:"var(--accent)", flexShrink:0, fontWeight:600 }}>
          Cadence<span style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:10, color:"var(--text6)", letterSpacing:"0.18em", marginLeft:8, fontWeight:400, textTransform:"uppercase" }}>lee a tu ritmo</span>
        </span>
        <div className="mono" style={{ fontSize:11, color:"var(--text6)", flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", textAlign:"center" }}>{loading ? "procesando…" : `${words.length.toLocaleString()} palabras`}</div>
        <div style={{ display:"flex", gap:6, flexShrink:0 }}>
          <button className="ctrl-btn" onClick={() => setPanel(p => p==="history"?null:"history")} style={{ background:"transparent", border:`1px solid ${panel==="history"?"var(--accent)":"var(--bordc)"}`, color:panel==="history"?"var(--accent)":"var(--text4)", borderRadius:9, padding:"9px 12px", fontSize:14, minHeight:40, cursor:"pointer" }}>↗</button>
          <button className="ctrl-btn" onClick={() => setPanel(p => p==="stats"?null:"stats")} style={{ background:panel==="stats"?"var(--accent-1f)":"transparent", border:`1px solid ${panel==="stats"?"var(--accent)":"var(--bordc)"}`, color:panel==="stats"?"var(--accent)":"var(--text4)", borderRadius:9, padding:"9px 12px", fontSize:14, minHeight:40, cursor:"pointer" }}>◷</button>
          <button className="ctrl-btn" onClick={() => setPanel(p => p==="input"?null:"input")} style={{ background:panel==="input"?"var(--accent-1f)":"transparent", border:`1px solid ${panel==="input"?"var(--accent)":"var(--bordc)"}`, color:panel==="input"?"var(--accent)":"var(--text4)", borderRadius:9, padding:"9px 12px", fontSize:13, minHeight:40, cursor:"pointer" }}>Texto</button>
          <button className="ctrl-btn" onClick={() => setPanel(p => p==="library"?null:"library")} style={{ background:panel==="library"?"var(--accent-1f)":"transparent", border:`1px solid ${panel==="library"?"var(--accent)":"var(--bordc)"}`, color:panel==="library"?"var(--accent)":"var(--text4)", borderRadius:9, padding:"9px 12px", fontSize:14, minHeight:40, cursor:"pointer" }}>☰</button>
          <button className="ctrl-btn" onClick={() => fileInputRef.current?.click()} disabled={loading} style={{ background:"transparent", border:"1px solid var(--bordc)", color:loading?"var(--text7)":"var(--text4)", borderRadius:9, padding:"9px 12px", fontSize:13, minHeight:40, cursor:"pointer" }}>{loading ? "…" : "Archivo"}</button>
          <input ref={fileInputRef} type="file" accept=".txt,.md,.docx,.epub,.pdf" style={{ display:"none" }} onChange={handleFile} />
        </div>
      </div>

      {error && (
        <div style={{ background:"#2a1414", borderBottom:"1px solid #4a2020", padding:"10px 18px", fontSize:13, color:"#f0a0a0", display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, position:"relative", zIndex:2 }}>
          <span style={{ flex:1 }}>{error}</span>
          <button onClick={() => setError("")} style={{ background:"transparent", border:"none", color:"#f0a0a0", cursor:"pointer", fontSize:22, lineHeight:1 }}>×</button>
        </div>
      )}

      {panel === "stats" && (
        <Dashboard metrics={metrics} cadence={cadence} calibration={calibration} calibrations={calibrations}
          sessionLog={sessionLog} docsMap={docsMap} history={history} reduce={reduce}
          onClose={() => setPanel(null)} fmtTime={fmtTime} fmtMs={fmtMs} fmtDate={fmtDate}
          onExport={exportBackup} onImport={() => backupInputRef.current?.click()} />
      )}
      <input ref={backupInputRef} type="file" accept="application/json,.json" style={{ display:"none" }}
        onChange={(e) => { const f = e.target.files?.[0]; if (f) importBackup(f); e.target.value = ""; }} />

      {panel === "input" && (
        <div className={anim("reveal")} style={{ background:"var(--surface)", borderBottom:"1px solid var(--bord)", padding:"14px 18px", display:"flex", flexDirection:"column", gap:10, position:"relative", zIndex:2 }}>
          <textarea value={inputText} onChange={e => setInputText(e.target.value)} placeholder="Pega aquí tu texto…"
            style={{ width:"100%", background:"var(--bg)", border:"1px solid var(--bordc)", color:"var(--text)", borderRadius:10, padding:"12px 14px", fontSize:15, resize:"vertical", minHeight:90, fontFamily:"inherit" }} />
          <button className="ctrl-btn" onClick={handleLoadText} style={{ background:"var(--accent)", color:"var(--bg)", border:"none", borderRadius:10, padding:"13px", fontSize:15, fontWeight:600, cursor:"pointer", minHeight:48 }}>Cargar texto</button>
        </div>
      )}

      {/* chapter nav: prev / current (opens list) / next */}
      {chapters.length > 1 && (
        <div style={{ background:"var(--surface2)", borderBottom:"1px solid var(--bord)", padding:"8px 14px", display:"flex", alignItems:"center", gap:8, position:"relative", zIndex:2 }}>
          <button className="ctrl-btn" onClick={prevChapter} disabled={currentChapterIdx <= 0}
            style={{ background:"transparent", border:"1px solid var(--bordc)", color: currentChapterIdx<=0?"var(--bordc)":"var(--text4)", borderRadius:8, width:38, height:36, cursor: currentChapterIdx<=0?"default":"pointer", fontSize:15, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>◂</button>
          <button className="ctrl-btn" onClick={() => setShowChapters(true)}
            style={{ flex:1, background:"transparent", border:"1px solid var(--bordc)", color:"var(--text2)", borderRadius:8, height:36, cursor:"pointer", fontSize:12.5, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
            <span>Capítulo {currentChapterIdx + 1} de {chapters.length}</span>
            <span className="mono" style={{ fontSize:10, color:"var(--text5)" }}>▾</span>
          </button>
          <button className="ctrl-btn" onClick={nextChapter} disabled={currentChapterIdx >= chapters.length - 1}
            style={{ background:"transparent", border:"1px solid var(--bordc)", color: currentChapterIdx>=chapters.length-1?"var(--bordc)":"var(--text4)", borderRadius:8, width:38, height:36, cursor: currentChapterIdx>=chapters.length-1?"default":"pointer", fontSize:15, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>▸</button>
        </div>
      )}

      {training && curBlock && (
        <div style={{ background:`${curBlock.color}14`, borderBottom:`1px solid ${curBlock.color}33`, padding:"10px 18px", display:"flex", alignItems:"center", justifyContent:"space-between", position:"relative", zIndex:2 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ width:8, height:8, borderRadius:"50%", background:curBlock.color }} />
            <span style={{ fontSize:13, color:curBlock.color, fontWeight:600 }}>{curBlock.label}</span>
            <span className="mono" style={{ fontSize:11, color:"var(--text6)" }}>bloque {training.blockIdx + 1}/{TRAINING_BLOCKS.length}</span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <span className="mono" style={{ fontSize:15, color:"var(--text)" }}>{fmtClock(blockRemaining)}</span>
            <button className="ctrl-btn" onClick={stopTraining} style={{ background:"transparent", border:"1px solid var(--bordc)", color:"var(--text4)", borderRadius:8, padding:"5px 12px", fontSize:12, cursor:"pointer" }}>Detener</button>
          </div>
        </div>
      )}

      {/* ── Reader area (tap = play/pause) ── */}
      {audioMode ? (
        <AudioReader chunks={audioChunks} activeChunk={activeChunk} loading={loading} accent={pc}
          onSeek={(start) => { setIndex(start); if (playingRef.current) { stopSpeak(); speakFrom(start); } }}
          reduce={reduce} hasText={words.length > 0} />
      ) : (
      <div onClick={handlePlayPause} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px 0", position:"relative", minHeight:0, cursor:"pointer", zIndex:2 }}>
        {/* reticle exactly on pivot x */}
        <div style={{ position:"absolute", left:`${PIVOT_X*100}%`, top:"calc(50% - 62px)", transform:"translateX(-50%)", width:1, height:18, background:`${pc}66`, pointerEvents:"none" }} />
        <div style={{ position:"absolute", left:`${PIVOT_X*100}%`, bottom:"calc(50% - 62px)", transform:"translateX(-50%)", width:1, height:18, background:`${pc}66`, pointerEvents:"none" }} />

        <div key={index} className={playing ? anim("word-pop") : ""} style={{ width:"100%", maxWidth:760, minHeight:90, display:"flex", alignItems:"center", padding:"16px 0" }}>
          {loading ? (
            <span style={{ color:"var(--text7)", fontFamily:"'Fraunces',serif", fontSize:24, width:"100%", textAlign:"center" }}>Procesando…</span>
          ) : currentWord ? (
            <WordDisplay word={currentWord} fontSize={fontSize} pivotColor={pc} />
          ) : (
            <span style={{ color:"var(--text7)", fontFamily:"'Fraunces',serif", fontSize:24, width:"100%", textAlign:"center" }}>Carga un texto</span>
          )}
        </div>

        <div className="mono" style={{ display:"flex", gap:18, marginTop:30, fontSize:10, color:"var(--text7)", letterSpacing:"0.08em", textTransform:"uppercase", flexWrap:"wrap", justifyContent:"center" }}>
          <span>{Math.min(index + 1, words.length)} / {words.length}</span>
          <span>{remaining > 0 ? `~${remaining} min` : "fin"}</span>
          <span>{Math.round(progress)}%</span>
          {!playing && !training && <span style={{ color:"var(--faint)" }}>tap = play</span>}
        </div>
      </div>
      )}

      {/* ── Scrubbable progress ── */}
      <div ref={trackRef} onPointerDown={handleScrubStart} onPointerMove={handleScrubMove} onPointerUp={handleScrubEnd} onPointerCancel={handleScrubEnd}
        style={{ width:"100%", cursor:"pointer", background:"var(--surface2)", padding:"16px 0", touchAction:"none", position:"relative", zIndex:2, borderTop:"1px solid var(--bord)" }}>
        <div style={{ position:"relative", height: scrubbing ? 7 : 4, margin:"0 16px", background:"var(--track)", borderRadius:4, transition:reduce?"none":"height 0.15s ease" }}>
          <div style={{ position:"absolute", left:0, top:0, bottom:0, width:`${progress}%`, background:"linear-gradient(to right,#9a7d22,var(--accent))", borderRadius:4, transition: scrubbing||reduce ? "none" : "width 0.1s linear", boxShadow: scrubbing ? "0 0 12px var(--accent-55)" : "none" }} />
          <div style={{ position:"absolute", top:"50%", left:`${progress}%`, width:scrubbing?20:13, height:scrubbing?20:13, background:"var(--accent)", borderRadius:"50%", transform:"translate(-50%,-50%)", transition:reduce?"none":"all 0.12s ease", boxShadow: scrubbing ? "0 0 0 6px var(--accent)22,0 2px 8px #00000088" : "0 1px 4px #00000088" }} />
          {scrubbing && (
            <div className="mono" style={{ position:"absolute", bottom:"calc(100% + 12px)", left:`${progress}%`, transform:"translateX(-50%)", background:"var(--bord)", border:"1px solid var(--accent-55)", color:"var(--accent)", padding:"5px 11px", borderRadius:8, fontSize:14, whiteSpace:"nowrap", boxShadow:"0 4px 14px #00000099" }}>
              {Math.round(progress)}% · {Math.min(index + 1, words.length)}/{words.length}
            </div>
          )}
        </div>
      </div>

      {/* ── Controls console ── */}
      <div className="panel" style={{ borderTop:"1px solid var(--bord)", padding:"16px 16px calc(16px + env(safe-area-inset-bottom))", display:"flex", flexDirection:"column", gap:15, position:"relative", zIndex:2 }}>

        {!audioMode && (
        <div style={{ display:"flex", gap:7, justifyContent:"center" }}>
          {Object.entries(MODES).map(([key, m]) => {
            const active = mode === key && !training;
            return (
              <button key={key} className="ctrl-btn" onClick={() => applyMode(key)}
                style={{ flex:1, maxWidth:110, background:active?`${m.color}1f`:"transparent", border:`1px solid ${active?m.color:"var(--bordc)"}`, color:active?m.color:"var(--text5)", borderRadius:11, padding:"9px 6px", fontSize:12.5, cursor:"pointer", minHeight:46 }}>
                <div style={{ fontWeight:600 }}>{m.label}</div>
                <div className="mono" style={{ fontSize:10, color:active?m.color:"var(--text7)", marginTop:2 }}>{m.wpm} wpm</div>
              </button>
            );
          })}
          <button className="ctrl-btn" onClick={training ? stopTraining : startTraining}
            style={{ flex:1, maxWidth:110, background:training?"#e87a4a1f":"var(--accent-14)", border:`1px solid ${training?"#e87a4a":"var(--accent-55)"}`, color:training?"#e87a4a":"var(--accent)", borderRadius:11, padding:"9px 6px", fontSize:12.5, cursor:"pointer", minHeight:46 }}>
            <div style={{ fontWeight:600 }}>{training ? "Detener" : "Entrenar"}</div>
            <div className="mono" style={{ fontSize:10, color:training?"#e87a4a":"#8a7838", marginTop:2 }}>{training ? "en curso" : "23 min"}</div>
          </button>
        </div>
        )}

        {!audioMode && (
        <button className="ctrl-btn" onClick={() => setCalibrating(true)}
          style={{ background:"#7a9ee814", border:"1px solid #7a9ee855", color:"#7a9ee8", borderRadius:11, padding:"11px", fontSize:13, cursor:"pointer", minHeight:46, display:"flex", alignItems:"center", justifyContent:"center", gap:10 }}>
          <span style={{ fontWeight:600 }}>Calibrar mi velocidad</span>
          {calibration && <span className="mono" style={{ fontSize:11, color:"#5fb86a" }}>óptimo {calibration.optimal} · techo {calibration.ceiling || "—"}</span>}
        </button>
        )}

        {!audioMode && (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:14 }}>
            <button className="ctrl-btn" onClick={() => adjustWpm(-25)} style={{ background:"var(--surface3)", border:"1px solid var(--bordc)", color:"var(--text3)", borderRadius:12, width:52, height:52, fontSize:26, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:300 }}>−</button>
            <div style={{ textAlign:"center", minWidth:120 }}>
              <div className="mono" style={{ fontSize:32, fontWeight:500, color:"var(--accent)", lineHeight:1 }}>{wpm}</div>
              <div style={{ fontSize:10, color:"var(--text6)", letterSpacing:"0.18em", textTransform:"uppercase", marginTop:4 }}>wpm{mode ? ` · ${MODES[mode].label}` : ""}</div>
            </div>
            <button className="ctrl-btn" onClick={() => adjustWpm(25)} style={{ background:"var(--surface3)", border:"1px solid var(--bordc)", color:"var(--text3)", borderRadius:12, width:52, height:52, fontSize:26, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:300 }}>+</button>
          </div>
          <div className="wpm-scroll">
            {wpmOptions.map(w => (
              <button key={w} className={`pill mono ${wpm===w?"active":""}`} onClick={() => { setWpm(w); setMode(null); }}
                style={{ background:"transparent", border:`1px solid ${wpm===w?"var(--accent)":"var(--bordc)"}`, color:wpm===w?"var(--accent)":"var(--text5)", borderRadius:20, padding:"8px 16px", fontSize:13, cursor:"pointer", minHeight:38, whiteSpace:"nowrap" }}>{w}</button>
            ))}
          </div>
          {wpm > 500 && <div style={{ fontSize:10, color:"#6a5a3a", textAlign:"center", letterSpacing:"0.04em" }}>Por encima de ~450 wpm en texto denso la comprensión cae; útil para triaje.</div>}
        </div>
        )}

        {/* Conmutador Lectura / Audio (un solo control segmentado) */}
        <div style={{ display:"flex", justifyContent:"center" }}>
          <div style={{ display:"inline-flex", background:"var(--surface2)", border:"1px solid var(--bordc)", borderRadius:12, padding:3, gap:3 }}>
            <button className="ctrl-btn" onClick={() => { if (audioMode) { setPlaying(false); stopSpeak(); setActiveChunk(-1); setAudioMode(false); } }}
              style={{ background: !audioMode ? "var(--accent-1f)" : "transparent", border:`1px solid ${!audioMode ? "var(--accent)" : "transparent"}`, color: !audioMode ? "var(--accent)" : "var(--text5)", borderRadius:9, padding:"9px 22px", fontSize:13.5, fontWeight:600, cursor:"pointer", minHeight:40 }}>
              Lectura
            </button>
            <button className="ctrl-btn" onClick={() => { if (!audioMode) { setPlaying(false); stopSpeak(); setActiveChunk(-1); setAudioMode(true); } }}
              style={{ background: audioMode ? "#7a9ee81f" : "transparent", border:`1px solid ${audioMode ? "#7a9ee8" : "transparent"}`, color: audioMode ? "#7a9ee8" : "var(--text5)", borderRadius:9, padding:"9px 22px", fontSize:13.5, fontWeight:600, cursor:"pointer", minHeight:40 }}>
              Audio
            </button>
          </div>
        </div>

        {/* Audio: velocidad compacta (−/valor/+) + engranaje de voz, en una sola línea */}
        {audioMode && (
          <div style={{ display:"flex", alignItems:"center", gap:10, position:"relative" }}>
            <span style={{ fontSize:11, color:"var(--text6)", letterSpacing:"0.12em", textTransform:"uppercase", flexShrink:0 }}>voz</span>
            <div style={{ display:"flex", alignItems:"center", gap:6, flex:1, justifyContent:"center" }}>
              <button className="ctrl-btn" onClick={() => setAudioRate(r => Math.max(1.0, Math.round((r - 0.1) * 10) / 10))}
                style={{ background:"var(--surface3)", border:"1px solid var(--bordc)", color:"var(--text3)", borderRadius:10, width:44, height:42, fontSize:22, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:300 }}>−</button>
              <div className="mono" style={{ minWidth:70, textAlign:"center", fontSize:22, fontWeight:500, color:"#7a9ee8" }}>x{audioRate.toFixed(1)}</div>
              <button className="ctrl-btn" onClick={() => setAudioRate(r => Math.min(2.0, Math.round((r + 0.1) * 10) / 10))}
                style={{ background:"var(--surface3)", border:"1px solid var(--bordc)", color:"var(--text3)", borderRadius:10, width:44, height:42, fontSize:22, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:300 }}>+</button>
            </div>
            <button className="ctrl-btn" onClick={() => setShowVoiceMenu(v => !v)} title="Elegir voz"
              style={{ background: showVoiceMenu ? "#7a9ee81f" : "transparent", border:`1px solid ${showVoiceMenu ? "#7a9ee8" : "var(--bordc)"}`, color: showVoiceMenu ? "#7a9ee8" : "var(--text4)", borderRadius:10, width:44, height:42, fontSize:18, cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>⚙</button>
            {showVoiceMenu && voices.length > 0 && (
              <>
                <div onClick={() => setShowVoiceMenu(false)} style={{ position:"fixed", inset:0, zIndex:40 }} />
                <div className={anim("reveal")} style={{ position:"absolute", bottom:"calc(100% + 8px)", right:0, zIndex:41, background:"var(--surface)", border:"1px solid var(--bord2)", borderRadius:14, padding:"8px", display:"flex", flexDirection:"column", gap:5, minWidth:240, maxHeight:300, overflowY:"auto", boxShadow:"0 8px 30px #00000055" }}>
                  <div style={{ fontSize:10, color:"var(--text6)", letterSpacing:"0.1em", textTransform:"uppercase", padding:"4px 8px", flexShrink:0 }}>Voz</div>
                  {voices.filter(v => /^es/i.test(v.lang)).concat(voices.filter(v => !/^es/i.test(v.lang))).map(v => {
                    const sel = v.voiceURI === audioVoice;
                    return (
                      <button key={v.voiceURI} className="ctrl-btn" onClick={() => { setAudioVoice(v.voiceURI); setShowVoiceMenu(false); }}
                        style={{ flexShrink:0, textAlign:"left", background: sel ? "#7a9ee81f" : "transparent", border:`1px solid ${sel ? "#7a9ee8" : "var(--bord)"}`, color: sel ? "#7a9ee8" : "var(--text3)", borderRadius:9, padding:"11px 12px", fontSize:13, lineHeight:1.2, cursor:"pointer", fontFamily:"inherit", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", minHeight:40 }}>
                        {v.name} <span style={{ color:"var(--text6)", fontSize:11 }}>({v.lang})</span>
                      </button>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        )}

        <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:16 }}>
          <button className="ctrl-btn" onClick={handleRestart} title="Reiniciar (R)" style={{ background:"transparent", border:"1px solid var(--bord)", color:"var(--text6)", borderRadius:12, width:50, height:50, cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>⟨⟨</button>
          <button className="ctrl-btn" onClick={handleBack} title="−10 (←)" style={{ background:"transparent", border:"1px solid var(--bord)", color:"var(--text5)", borderRadius:12, width:50, height:50, cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>◂◂</button>

// ── Speed vs retention scatter (SVG, no deps) ─────────────────────────────────
function ScatterRetention({ data }) {
  const W = 460, H = 180, pad = 34;
  const wpms = data.map(d => d.wpm);
  const minW = Math.min(...wpms, 200), maxW = Math.max(...wpms, 500);
  const xScale = (w) => pad + ((w - minW) / Math.max(1, maxW - minW)) * (W - 2 * pad);
  const yScale = (r) => H - pad - ((r - 1) / 4) * (H - 2 * pad);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto" }}>
      {[1,2,3,4,5].map(r => (
        <g key={r}>
          <line x1={pad} y1={yScale(r)} x2={W-pad} y2={yScale(r)} stroke="var(--bord)" strokeWidth="1" />
          <text x={pad-8} y={yScale(r)+4} fill="var(--text6)" fontSize="10" textAnchor="end" fontFamily="monospace">{r}</text>
        </g>
      ))}
      <text x={pad-8} y={pad-10} fill="var(--text6)" fontSize="9" textAnchor="end" fontFamily="monospace">ret</text>
      {[minW, Math.round((minW+maxW)/2), maxW].map((w,i) => (
        <text key={i} x={xScale(w)} y={H-pad+16} fill="var(--text6)" fontSize="10" textAnchor="middle" fontFamily="monospace">{w}</text>
      ))}
      <text x={W-pad} y={H-6} fill="var(--text6)" fontSize="9" textAnchor="end" fontFamily="monospace">cadencia (wpm)</text>
      {data.map((d, i) => (
        <circle key={i} cx={xScale(d.wpm)} cy={yScale(d.retention)} r="5" fill="var(--accent)" opacity="0.8" />
      ))}
    </svg>
  );
}

// ── Calibration overlay: rising-speed passages + MCQ → optimal speed ──────────
function CalibrationOverlay({ pivotColor, fontSize, onClose, onApply, onSave, reduce }) {
  const [stage, setStage] = useState("intro"); // intro | countdown | reading | quiz | done
  const [pIdx, setPIdx] = useState(0);
  const [results, setResults] = useState([]); // {wpm, comp}
  const [wordIdx, setWordIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [countdown, setCountdown] = useState(3);
  // selección aleatoria de pasajes (uno por velocidad), fijada al montar — no se repiten dentro de la sesión
  const [picked] = useState(() => {
    const pool = [...CALIB_PASSAGES.keys()];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return pool.slice(0, CALIB_SPEEDS.length);
  });
  const total = CALIB_SPEEDS.length;

  const passage = CALIB_PASSAGES[picked[pIdx]];
  const speed = CALIB_SPEEDS[pIdx];
  const words = passage ? parseText(passage.text) : [];
  const timeoutRef = useRef(null);
  const idxRef = useRef(0); idxRef.current = wordIdx;
  const anim = (n) => reduce ? "" : n;

  // countdown → reading
  useEffect(() => {
    if (stage !== "countdown") return;
    if (countdown <= 0) { setStage("reading"); setWordIdx(0); return; }
    const t = setTimeout(() => setCountdown(c => c - 1), 700);
    return () => clearTimeout(t);
  }, [stage, countdown]);

  // reading engine (isolated)
  useEffect(() => {
    if (stage !== "reading") return;
    const run = () => {
      const w = words[idxRef.current] || "";
      const delay = getDelay(w, speed, 0.7);
      timeoutRef.current = setTimeout(() => {
        const next = idxRef.current + 1;
        if (next >= words.length) { setStage("quiz"); setAnswers([]); return; }
        setWordIdx(next); run();
      }, delay);
    };
    run();
    return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
  }, [stage]); // eslint-disable-line

  const startPassage = () => { setCountdown(3); setStage("countdown"); };
  const answerQ = (qi, oi) => setAnswers(a => { const n = [...a]; n[qi] = oi; return n; });
  const submitQuiz = () => {
    let correct = 0;
    passage.questions.forEach((q, i) => { if (answers[i] === q.correct) correct++; });
    const comp = correct / passage.questions.length;
    const newResults = [...results, { wpm: speed, comp }];
    setResults(newResults);
    if (pIdx + 1 >= total) {
      setStage("done");
      onSave(newResults);
    } else { setPIdx(pIdx + 1); setStage("intro2"); }
  };

  const allAnswered = passage && answers.length === passage.questions.length && answers.every(a => a !== undefined);
  const analysis = stage === "done" ? analyzeCalibration(results) : null;
  const pc = PIVOT_COLORS[pivotColor].value;

  const wrap = { position:"absolute", inset:0, zIndex:60, background:"var(--bg)f2", backdropFilter:"blur(10px)", display:"flex", alignItems:"center", justifyContent:"center", padding:"24px" };
  const card = { width:"100%", maxWidth:480, background:"var(--surface)", border:"1px solid var(--bord2)", borderRadius:20, padding:"28px 24px", display:"flex", flexDirection:"column", gap:18, maxHeight:"92vh", overflowY:"auto" };

  return (
    <div style={wrap}>
      <div className={anim("reveal")} style={card}>
        {(stage === "intro" || stage === "intro2") && (
          <>
            <div style={{ fontFamily:"'Fraunces',serif", fontSize:25, color:"var(--accent)" }}>Calibración</div>
            {stage === "intro" ? (
              <div style={{ fontSize:14, color:"var(--text3)", lineHeight:1.55 }}>
                Seis pasajes breves a velocidad creciente (250 → 700), elegidos al azar de un banco amplio para que no se repitan. Tras cada uno, tres preguntas. No podrás volver atrás: lee como si fuera real. Las velocidades altas (650-700) miden tu lectura de triaje, no tu lectura cuidadosa. Al final verás tu curva velocidad/comprensión y tu velocidad óptima honesta. Dura unos 7 minutos.
              </div>
            ) : (
              <div style={{ fontSize:14, color:"var(--text3)", lineHeight:1.55 }}>
                Pasaje {pIdx + 1} de {total}. Siguiente velocidad: <span className="mono" style={{ color:"var(--accent)" }}>{speed} wpm</span>.
              </div>
            )}
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={onClose} style={{ flex:1, background:"transparent", border:"1px solid var(--bordc)", color:"var(--text4)", borderRadius:12, padding:"13px", fontSize:14, cursor:"pointer" }}>Salir</button>
              <button onClick={startPassage} style={{ flex:2, background:"var(--accent)", color:"var(--bg)", border:"none", borderRadius:12, padding:"13px", fontSize:15, fontWeight:600, cursor:"pointer" }}>{stage === "intro" ? "Empezar" : "Continuar"}</button>
            </div>
          </>
        )}

        {stage === "countdown" && (
          <div style={{ textAlign:"center", padding:"40px 0" }}>
            <div className="mono" style={{ fontSize:64, color:"var(--accent)", fontWeight:500 }}>{countdown > 0 ? countdown : "¡Ya!"}</div>
            <div style={{ fontSize:13, color:"var(--text5)", marginTop:10 }}>{speed} wpm · pasaje {pIdx + 1}/{total}</div>
          </div>
        )}

        {stage === "reading" && (
          <div style={{ position:"relative", padding:"40px 0", minHeight:160, display:"flex", alignItems:"center" }}>
            <div style={{ position:"absolute", left:`${PIVOT_X*100}%`, top:"calc(50% - 40px)", transform:"translateX(-50%)", width:1, height:14, background:`${pc}66` }} />
            <div style={{ position:"absolute", left:`${PIVOT_X*100}%`, bottom:"calc(50% - 40px)", transform:"translateX(-50%)", width:1, height:14, background:`${pc}66` }} />
            <div style={{ width:"100%" }}><WordDisplay word={words[wordIdx]} fontSize={Math.min(fontSize, 40)} pivotColor={pc} /></div>
          </div>
        )}

        {stage === "quiz" && (
          <>
            <div style={{ fontSize:12, color:"var(--text5)", letterSpacing:"0.08em", textTransform:"uppercase" }}>Pasaje {pIdx + 1} · {speed} wpm</div>
            {passage.questions.map((q, qi) => (
              <div key={qi} style={{ display:"flex", flexDirection:"column", gap:8 }}>
                <div style={{ fontSize:14, color:"var(--text)", fontWeight:500 }}>{q.q}</div>
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {q.opts.map((opt, oi) => {
                    const sel = answers[qi] === oi;
                    return (
                      <button key={oi} onClick={() => answerQ(qi, oi)}
                        style={{ textAlign:"left", background: sel ? "var(--accent-1f)" : "var(--bg)", border:`1px solid ${sel ? "var(--accent)" : "var(--bordc)"}`, color: sel ? "var(--accent)" : "var(--text3)", borderRadius:10, padding:"11px 14px", fontSize:14, cursor:"pointer", fontFamily:"inherit" }}>{opt}</button>
                    );
                  })}
                </div>
              </div>
            ))}
            <button disabled={!allAnswered} onClick={submitQuiz}
              style={{ background: allAnswered ? "var(--accent)" : "var(--bordc)", color: allAnswered ? "var(--bg)" : "var(--text6)", border:"none", borderRadius:12, padding:"14px", fontSize:15, fontWeight:600, cursor: allAnswered ? "pointer" : "default" }}>
              {pIdx + 1 >= total ? "Ver resultado" : "Siguiente pasaje"}
            </button>
          </>
        )}

        {stage === "done" && analysis && (
          <>
            <div style={{ fontFamily:"'Fraunces',serif", fontSize:25, color:"var(--accent)" }}>Tu curva</div>
            <CalibCurve points={results} />
            <div style={{ display:"flex", justifyContent:"space-around", gap:10, padding:"14px 0", borderTop:"1px solid var(--bord)", borderBottom:"1px solid var(--bord)" }}>
              {[{ v: analysis.optimal, l: "óptimo", c: "#5fb86a" }, { v: analysis.ceiling || "—", l: "techo 70%", c: "#e87a4a" }, { v: analysis.basal || "—", l: "cómodo", c: "#7a9ee8" }].map((s, i) => (
                <div key={i} style={{ textAlign:"center" }}>
                  <div className="mono" style={{ fontSize:24, fontWeight:500, color:s.c, lineHeight:1 }}>{s.v}</div>
                  <div style={{ fontSize:10, color:"var(--text5)", letterSpacing:"0.06em", textTransform:"uppercase", marginTop:6 }}>{s.l}</div>
                </div>
              ))}
            </div>
            <div style={{ fontSize:13.5, color:"var(--text3)", lineHeight:1.55 }}>
              Tu comprensión se mantiene sólida hasta <span className="mono" style={{ color:"#5fb86a" }}>{analysis.optimal} wpm</span>. {analysis.ceiling ? <>A partir de unas <span className="mono" style={{ color:"#e87a4a" }}>{analysis.ceiling} wpm</span> cae por debajo del 70 %: reserva esa zona para triaje, no para lectura cuidadosa.</> : <>Mantuviste buena comprensión en todo el rango probado; puedes intentar velocidades algo mayores en otra calibración.</>} Para lectura de trabajo, fija tu ritmo en torno al óptimo.
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={onClose} style={{ flex:1, background:"transparent", border:"1px solid var(--bordc)", color:"var(--text4)", borderRadius:12, padding:"13px", fontSize:14, cursor:"pointer" }}>Cerrar</button>
              <button onClick={() => { onApply(analysis.optimal); onClose(); }} style={{ flex:2, background:"var(--accent)", color:"var(--bg)", border:"none", borderRadius:12, padding:"13px", fontSize:15, fontWeight:600, cursor:"pointer" }}>Aplicar {analysis.optimal} wpm</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// Calibration curve: wpm (x) vs comprehension % (y), with 70% threshold line
function CalibCurve({ points }) {
  const W = 432, H = 190, pad = 36;
  const xs = points.map(p => p.wpm);
  const minW = Math.min(...xs), maxW = Math.max(...xs);
  const xScale = (w) => pad + ((w - minW) / Math.max(1, maxW - minW)) * (W - 2 * pad);
  const yScale = (c) => H - pad - c * (H - 2 * pad);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${xScale(p.wpm)},${yScale(p.comp)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto" }}>
      {[0, 0.25, 0.5, 0.7, 1].map(c => (
        <g key={c}>
          <line x1={pad} y1={yScale(c)} x2={W - pad} y2={yScale(c)} stroke={c === 0.7 ? "#e87a4a44" : "var(--bord)"} strokeWidth="1" strokeDasharray={c === 0.7 ? "4 4" : "0"} />
          <text x={pad - 8} y={yScale(c) + 4} fill={c === 0.7 ? "#e87a4a" : "var(--text6)"} fontSize="9" textAnchor="end" fontFamily="monospace">{Math.round(c * 100)}</text>
        </g>
      ))}
      {points.map((p, i) => (
        <text key={i} x={xScale(p.wpm)} y={H - pad + 15} fill="var(--text6)" fontSize="9" textAnchor="middle" fontFamily="monospace">{p.wpm}</text>
      ))}
      <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2" />
      {points.map((p, i) => (
        <circle key={i} cx={xScale(p.wpm)} cy={yScale(p.comp)} r="4.5" fill={p.comp >= 0.7 ? "#5fb86a" : "#e87a4a"} />
      ))}
    </svg>
  );
}

// ── Dashboard cognitivo: tiles + curva de aprendizaje + throughput efectivo ───
function Dashboard({ metrics, cadence, calibration, calibrations, sessionLog, docsMap, history, reduce, onClose, fmtTime, fmtMs, fmtDate, onExport, onImport }) {
  const anim = (n) => reduce ? "" : n;
  const now = Date.now();
  const monthAgo = now - 30 * 86400000;

  // words this month (from session log)
  const monthWords = sessionLog.filter(s => s.ts >= monthAgo).reduce((a, s) => a + s.words, 0);
  // completed docs (>=95%)
  const completed = Object.values(docsMap).filter(d => d.maxPct >= 95).length;
  const inProgress = Object.values(docsMap).filter(d => d.maxPct > 2 && d.maxPct < 95).length;

  // effective throughput from latest calibration
  const effPoints = calibration ? calibration.points.map(p => ({ wpm: p.wpm, comp: p.comp, eff: Math.round(p.wpm * p.comp) })) : [];
  const peakEff = effPoints.length ? effPoints.reduce((m, p) => p.eff > m.eff ? p : m, effPoints[0]) : null;

  // daily words last 30 days
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now - i * 86400000); const key = d.toISOString().slice(0, 10);
    const w = sessionLog.filter(s => new Date(s.ts).toISOString().slice(0, 10) === key).reduce((a, s) => a + s.words, 0);
    days.push({ key, w });
  }
  const maxDay = Math.max(1, ...days.map(d => d.w));

  const tiles = [
    { l: "Palabras / mes", v: monthWords.toLocaleString(), c: "var(--accent)" },
    { l: "Horas totales", v: (metrics.totalMs / 3600000).toFixed(1), c: "var(--accent)" },
    { l: "Velocidad óptima", v: calibration ? calibration.optimal : "—", c: "#5fb86a" },
    { l: "Máx. sostenible", v: calibration?.ceiling || "—", c: "#e87a4a" },
    { l: "Completados", v: completed, c: "#7a9ee8" },
    { l: "Racha", v: `${metrics.streak} d`, c: "var(--accent)" },
  ];

  return (
    <div onClick={onClose} style={{ position:"absolute", inset:0, zIndex:55, background:"var(--bg)f2", backdropFilter:"blur(10px)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"20px", overflowY:"auto" }}>
      <div onClick={e => e.stopPropagation()} className={anim("reveal")} style={{ width:"100%", maxWidth:540, background:"var(--surface)", border:"1px solid var(--bord2)", borderRadius:20, padding:"22px", display:"flex", flexDirection:"column", gap:20, marginTop:"3vh", marginBottom:"3vh" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:25, color:"var(--accent)" }}>Panel cognitivo</div>
          <button onClick={onClose} style={{ background:"transparent", border:"none", color:"var(--text4)", cursor:"pointer", fontSize:26, lineHeight:1 }}>×</button>
        </div>

        {/* Tiles */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
          {tiles.map((t, i) => (
            <div key={i} style={{ background:"var(--surface2)", border:"1px solid var(--bord)", borderRadius:12, padding:"14px 10px", textAlign:"center" }}>
              <div className="mono" style={{ fontSize:22, fontWeight:500, color:t.c, lineHeight:1 }}>{t.v}</div>
              <div style={{ fontSize:9.5, color:"var(--text6)", letterSpacing:"0.06em", textTransform:"uppercase", marginTop:6 }}>{t.l}</div>
            </div>
          ))}
        </div>

        {/* Throughput efectivo — the honest reina metric */}
        {peakEff && (
          <div style={{ background:"var(--surface2)", border:"1px solid var(--bord)", borderRadius:14, padding:"16px" }}>
            <div style={{ fontSize:12, color:"var(--text3)", letterSpacing:"0.04em", marginBottom:4 }}>Throughput efectivo · palabras absorbidas/min</div>
            <div style={{ fontSize:11, color:"var(--text6)", marginBottom:14 }}>Velocidad × comprensión. Tu pico real está en <span className="mono" style={{ color:"#5fb86a" }}>{peakEff.wpm} wpm</span>, no en tu velocidad máxima.</div>
            <EffChart points={effPoints} peak={peakEff} />
          </div>
        )}

        {/* Curva de aprendizaje (evolution) or single calibration */}
        <div style={{ background:"var(--surface2)", border:"1px solid var(--bord)", borderRadius:14, padding:"16px" }}>

        {/* Actividad mensual */}
        <div style={{ background:"var(--surface2)", border:"1px solid var(--bord)", borderRadius:14, padding:"16px" }}>
          <div style={{ fontSize:12, color:"var(--text3)", letterSpacing:"0.04em", marginBottom:14 }}>Actividad · últimos 30 días</div>
          <div style={{ display:"flex", alignItems:"flex-end", gap:2, height:70 }}>
            {days.map((d, i) => (
              <div key={i} title={`${d.w} palabras`} style={{ flex:1, height:`${Math.max(2, (d.w / maxDay) * 100)}%`, background: d.w > 0 ? "linear-gradient(to top,#8a7020,var(--accent))" : "var(--bord)", borderRadius:2, minHeight:2 }} />
            ))}
          </div>
          <div className="mono" style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--text6)", marginTop:6 }}>
            <span>hace 30 d</span><span>hoy</span>
          </div>
        </div>

        {/* General stats */}
        <div style={{ display:"flex", justifyContent:"space-around", gap:10, fontSize:12, color:"var(--text4)", flexWrap:"wrap" }}>
          <span>Total: <span className="mono" style={{ color:"var(--text2)" }}>{metrics.totalWordsRead.toLocaleString()}</span> pal</span>
          <span>Cadencia: <span className="mono" style={{ color:"var(--text2)" }}>{cadence || "—"}</span></span>
          <span>Sesiones: <span className="mono" style={{ color:"var(--text2)" }}>{metrics.sessions}</span></span>
          <span>En curso: <span className="mono" style={{ color:"var(--text2)" }}>{inProgress}</span></span>
        </div>

        {/* Backup / restore */}
        <div style={{ borderTop:"1px solid var(--bord)", paddingTop:16, display:"flex", flexDirection:"column", gap:8 }}>
          <div style={{ fontSize:11, color:"var(--text6)", letterSpacing:"0.06em", textTransform:"uppercase" }}>Copia de seguridad</div>
          <div style={{ fontSize:11.5, color:"var(--text5)", lineHeight:1.5 }}>Tus datos viven solo en este dispositivo. Exporta una copia para no perderlos si reinstalas o cambias de móvil.</div>
          <div style={{ display:"flex", gap:10 }}>
            <button className="ctrl-btn" onClick={onExport} style={{ flex:1, background:"var(--accent-1f)", border:"1px solid var(--accent)", color:"var(--accent)", borderRadius:11, padding:"12px", fontSize:13.5, fontWeight:600, cursor:"pointer" }}>Exportar datos</button>
            <button className="ctrl-btn" onClick={onImport} style={{ flex:1, background:"transparent", border:"1px solid var(--bordc)", color:"var(--text4)", borderRadius:11, padding:"12px", fontSize:13.5, cursor:"pointer" }}>Restaurar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// Effective throughput chart: bars of wpm×comp, peak highlighted
function EffChart({ points, peak }) {
  const W = 480, H = 150, pad = 30;
  const maxEff = Math.max(...points.map(p => p.eff), 1);
  const bw = (W - 2 * pad) / points.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto" }}>
      {points.map((p, i) => {
        const h = (p.eff / maxEff) * (H - 2 * pad);
        const x = pad + i * bw, isPeak = p.wpm === peak.wpm;
        return (
          <g key={i}>
            <rect x={x + 4} y={H - pad - h} width={bw - 8} height={h} rx="3" fill={isPeak ? "#5fb86a" : "#3a4a3a"} opacity={isPeak ? 1 : 0.6} />
            <text x={x + bw / 2} y={H - pad - h - 5} fill={isPeak ? "#5fb86a" : "var(--text5)"} fontSize="11" textAnchor="middle" fontFamily="monospace">{p.eff}</text>
            <text x={x + bw / 2} y={H - pad + 14} fill="var(--text6)" fontSize="9" textAnchor="middle" fontFamily="monospace">{p.wpm}</text>
            <text x={x + bw / 2} y={H - pad + 25} fill="var(--text7)" fontSize="8" textAnchor="middle" fontFamily="monospace">{Math.round(p.comp * 100)}%</text>
          </g>
        );
      })}
    </svg>
  );
}

// Evolution chart: óptimo + techo across calibrations over time
function EvolutionChart({ calibs }) {
  const W = 480, H = 160, pad = 36;
  const data = [...calibs].sort((a, b) => a.ts - b.ts);
  const opts = data.map(d => d.optimal);
  const ceils = data.map(d => d.ceiling || d.optimal);
  const minV = Math.min(...opts) - 40, maxV = Math.max(...ceils) + 40;
  const xScale = (i) => pad + (data.length === 1 ? 0.5 : i / (data.length - 1)) * (W - 2 * pad);
  const yScale = (v) => H - pad - ((v - minV) / Math.max(1, maxV - minV)) * (H - 2 * pad);
  const line = (arr) => arr.map((v, i) => `${i === 0 ? "M" : "L"}${xScale(i)},${yScale(v)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto" }}>
      <path d={line(ceils)} fill="none" stroke="#e87a4a" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.7" />
      <path d={line(opts)} fill="none" stroke="#5fb86a" strokeWidth="2" />
      {data.map((d, i) => (
        <g key={i}>
          <circle cx={xScale(i)} cy={yScale(d.optimal)} r="4" fill="#5fb86a" />
          <circle cx={xScale(i)} cy={yScale(d.ceiling || d.optimal)} r="3" fill="#e87a4a" />
          <text x={xScale(i)} y={H - 8} fill="var(--text6)" fontSize="9" textAnchor="middle" fontFamily="monospace">{new Date(d.ts).toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" })}</text>
        </g>
      ))}
      <text x={pad} y={16} fill="#5fb86a" fontSize="10" fontFamily="monospace">óptimo</text>
      <text x={pad + 60} y={16} fill="#e87a4a" fontSize="10" fontFamily="monospace">techo</text>
    </svg>
  );
}
